<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Cockpit IFR – EBCI / EBLG</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Style cockpit IFR -->
  <link rel="stylesheet" href="css/style.css?v=155">
</head>

<body>

<header>
  <h1>COCKPIT IFR – EBCI / EBLG</h1>
  <div class="small">METAR + AirLabs + Couloir bruit + ND Airbus</div>
</header>

<button id="toggle-sidebar">☰ PANNEAUX</button>

<main>

  <!-- CARTE ND AIRBUS -->
  <div id="map"></div>

  <!-- CONTENEUR LATERAL -->
  <div id="layout">

    <!-- SIDEBAR -->
    <div id="sidebar">

      <div class="sidebar-controls">
        <button class="sidebar-btn" data-target="EBCI">EBCI</button>
        <button class="sidebar-btn" data-target="EBLG">EBLG</button>
        <button class="sidebar-btn" data-target="ALL">Tous</button>
      </div>

      <div class="sidebar-tabs">
        <button class="mcdu-tab active" data-tab="tab-metar">METAR</button>
        <button class="mcdu-tab" data-tab="tab-sono">SONO</button>
        <button class="mcdu-tab" data-tab="tab-fids">FIDS</button>
        <button class="mcdu-tab" data-tab="tab-logs">LOGS</button>
      </div>

    </div>

    <!-- PANELS -->
    <div id="panels">

      <!-- PANEL METAR -->
      <div id="tab-metar" class="tab-panel active">

        <h2 class="mcdu-title">METAR — Cockpit IFR</h2>

        <div class="mcdu-section">
          <h3 class="mcdu-subtitle">EBCI — Rose des vents</h3>
          <div id="wind-rose-ebci"></div>
        </div>

        <div class="mcdu-section">
          <h3 class="mcdu-subtitle">EBCI — METAR</h3>
          <div id="metar-ebci"></div>
        </div>

        <div class="mcdu-section">
          <h3 class="mcdu-subtitle">EBCI — Station</h3>
          <div id="station-ebci"></div>
        </div>

        <hr class="mcdu-sep">

        <div class="mcdu-section">
          <h3 class="mcdu-subtitle">EBLG — Rose des vents</h3>
          <div id="wind-rose-eblg"></div>
        </div>

        <div class="mcdu-section">
          <h3 class="mcdu-subtitle">EBLG — METAR</h3>
          <div id="metar-eblg"></div>
        </div>

        <div class="mcdu-section">
          <h3 class="mcdu-subtitle">EBLG — Station</h3>
          <div id="station-eblg"></div>
        </div>

      </div>

      <!-- PANEL SONO -->
      <div id="tab-sono" class="tab-panel">
        ...
      </div>

      <!-- PANEL FIDS -->
      <div id="tab-fids" class="tab-panel">
        ...
      </div>

      <!-- PANEL LOGS -->
      <div id="tab-logs" class="tab-panel">
        ...
      </div>

    </div>

  </div>

</main>


<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Cockpit IFR Airbus (ES Modules) -->
<script type="module" src="js/app.js?v=155"></script>

</body>
</html>
